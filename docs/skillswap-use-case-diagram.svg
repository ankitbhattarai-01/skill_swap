<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img" aria-labelledby="title desc">
  <title id="title">SkillSwap Connect UML Use Case Diagram</title>
  <desc id="desc">Academic UML use case diagram showing Learner, Teacher, and Administrator actors connected to their platform use cases.</desc>
  <defs>
    <style>
      .page { fill: #ffffff; }
      .system { fill: #ffffff; stroke: #111111; stroke-width: 3; }
      .heading { font: 700 34px Arial, Helvetica, sans-serif; fill: #111111; text-anchor: middle; letter-spacing: 0; }
      .system-title { font: 700 25px Arial, Helvetica, sans-serif; fill: #111111; text-anchor: middle; letter-spacing: 0; }
      .actor { fill: none; stroke: #111111; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .actor-label { font: 700 22px Arial, Helvetica, sans-serif; fill: #111111; text-anchor: middle; letter-spacing: 0; }
      .actor-note { font: 400 15px Arial, Helvetica, sans-serif; fill: #444444; text-anchor: middle; letter-spacing: 0; }
      .case { fill: #ffffff; stroke: #111111; stroke-width: 2.3; }
      .case-text { font: 600 17px Arial, Helvetica, sans-serif; fill: #111111; text-anchor: middle; dominant-baseline: middle; letter-spacing: 0; }
      .case-text-small { font: 600 16px Arial, Helvetica, sans-serif; fill: #111111; text-anchor: middle; dominant-baseline: middle; letter-spacing: 0; }
      .assoc { fill: none; stroke: #111111; stroke-width: 2; stroke-linecap: round; }
      .divider { stroke: #c9c9c9; stroke-width: 1.4; stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect class="page" width="1800" height="1280"/>
  <text class="heading" x="900" y="58">SkillSwap Connect - UML Use Case Diagram</text>

  <rect class="system" x="135" y="105" width="1530" height="1120" rx="10"/>
  <text class="system-title" x="900" y="150">SkillSwap Connect Platform</text>
  <line class="divider" x1="660" y1="185" x2="660" y2="1185"/>
  <line class="divider" x1="1140" y1="185" x2="1140" y2="1185"/>

  <path class="assoc" d="M415 422 L415 462"/>
  <path class="assoc" d="M438 426 L438 552"/>
  <path class="assoc" d="M461 428 L461 642"/>
  <path class="assoc" d="M484 428 L484 732"/>
