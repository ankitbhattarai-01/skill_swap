  <g id="learner-actor" transform="translate(495 258)">
    <text class="actor-label" x="0" y="-56">Learner</text>
    <text class="actor-note" x="0" y="-32">role-based actor</text>
    <circle class="actor" cx="0" cy="0" r="27"/>
    <path class="actor" d="M0 27 L0 105 M-56 61 L56 61 M0 105 L-46 165 M0 105 L46 165"/>
  </g>

  <g id="teacher-actor" transform="translate(928 258)">
    <text class="actor-label" x="0" y="-56">Teacher</text>
    <text class="actor-note" x="0" y="-32">role-based actor</text>
    <circle class="actor" cx="0" cy="0" r="27"/>
    <path class="actor" d="M0 27 L0 105 M-56 61 L56 61 M0 105 L-46 165 M0 105 L46 165"/>
  </g>

  <g id="administrator-actor" transform="translate(1365 258)">
    <text class="actor-label" x="0" y="-56">Administrator</text>
    <circle class="actor" cx="0" cy="0" r="27"/>
    <path class="actor" d="M0 27 L0 105 M-56 61 L56 61 M0 105 L-46 165 M0 105 L46 165"/>
  </g>

