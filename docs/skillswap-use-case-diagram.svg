  <ellipse class="case" cx="495" cy="1130" rx="157" ry="38"/>
  <text class="case-text" x="495" y="1130">Propose swaps</text>

  <ellipse class="case" cx="928" cy="500" rx="140" ry="38"/>
  <text class="case-text" x="928" y="500">Accept requests</text>
  <ellipse class="case" cx="928" cy="590" rx="140" ry="38"/>
