  <ellipse class="case" cx="1365" cy="560" rx="160" ry="38"/>
  <text class="case-text" x="1365" y="560">Manage skills catalogue</text>
  <ellipse class="case" cx="1365" cy="700" rx="160" ry="38"/>
  <text class="case-text" x="1365" y="700">Suspend users</text>
  <ellipse class="case" cx="1365" cy="840" rx="160" ry="38"/>
  <text class="case-text" x="1365" y="840">View finance dashboard</text>
  <ellipse class="case" cx="1365" cy="980" rx="160" ry="38"/>
  <text class="case-text" x="1365" y="980">Resolve user reports</text>
  <ellipse class="case" cx="1365" cy="1120" rx="178" ry="38"/>
  <text class="case-text-small" x="1365" y="1120">Forcefully complete sessions</text>
</svg>
